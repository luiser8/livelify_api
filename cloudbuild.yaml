steps:
# PASO 1: Construir la imagen de Docker
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args:
    - 'build'
    - '-t'
    - 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify-api/${_SERVICE_NAME}:$COMMIT_SHA'
    - '.'

# PASO 2: Subir la imagen a Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args: ['push', 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify-api/${_SERVICE_NAME}:$COMMIT_SHA']
  waitFor:
    - Build

# -----------------------------------------------------------------
# PASO 3 (NUEVO): Actualizar el Job de Migración
# Le decimos al Job que use la nueva imagen que acabamos de subir.
# -----------------------------------------------------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Update-Migrator-Job
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'update'
    - '${_SERVICE_NAME}-migrator'
    - '--image'
    - 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify-api/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
  waitFor:
    - Push

# -----------------------------------------------------------------
# PASO 4 (NUEVO): Ejecutar el Job de Migración
# Ahora que está actualizado, lo ejecutamos.
# -----------------------------------------------------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Execute-Migrator-Job
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'execute'
    - '${_SERVICE_NAME}-migrator'
    - '--region'
    - 'us-central1'
    - '--wait'
  waitFor:
    - Update-Migrator-Job

# -----------------------------------------------------------------
# PASO 5: Desplegar el servicio principal en Cloud Run
# -----------------------------------------------------------------
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Deploy
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image'
    - 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify-api/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--update-secrets=DATABASE_URL=DATABASE_URL:latest,APP_JWT_SECRET=APP_JWT_SECRET:latest' #...etc
  waitFor:
    - Execute-Migrator-Job

# ... (resto del archivo sin cambios)
substitutions:
  _SERVICE_NAME: 'livelify-api'
  _PROJECT_ID: 'livelify-dev'
