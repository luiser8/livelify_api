steps:
  # 1. Construir la imagen de Docker, pasando el secreto DATABASE_URL de forma segura.
  - name: 'gcr.io/cloud-builders/docker'
    # Usamos un entrypoint de 'bash' para controlar la expansión de variables.
    entrypoint: 'bash'
    args:
      - '-c'
      # El script de shell asegura que $$DATABASE_URL se resuelva a partir de la variable de entorno del paso.
      - |
        docker build \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          -t "us-central1-docker.pkg.dev/${PROJECT_ID}/livelify_api/${_SERVICE_NAME}:$COMMIT_SHA" \
          .
    # secretEnv hace que el secreto de Secret Manager esté disponible como una variable de entorno para ESTE paso.
    secretEnv: ['DATABASE_URL']

  # 2. Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify_api/${_SERVICE_NAME}:$COMMIT_SHA'

  # 3. Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      # Usamos tu variable _SERVICE_NAME para el nombre del servicio.
      - '${_SERVICE_NAME}'
      - '--image'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/livelify_api/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--project'
      - '${_PROJECT_ID}' # Variable definida en el trigger (ej. 'livelify-dev')

# Definimos las variables que se pueden sustituir en el trigger.
substitutions:
  _SERVICE_NAME: 'livelify-api'
  # Proporcionamos un valor por defecto para _PROJECT_ID.
  # Este valor será SOBREESCRITO por la variable definida en tu Trigger.
  # Esto previene el error si la variable no se pasa o en ejecuciones manuales.
  _PROJECT_ID: 'livelify-dev'

# Opciones de registro para la compilación.
options:
  logging: CLOUD_LOGGING_ONLY

# Aquí definimos qué secretos de Secret Manager estarán disponibles para los pasos de esta compilación.
availableSecrets:
  secretManager:
  - versionName: projects/${_PROJECT_ID}/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
